<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Cloud Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --azure-blue: #0078d4;
            --azure-glow: rgba(0, 120, 212, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --user-bubble: #0078d4;
            --bot-bubble: rgba(51, 65, 85, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 750px;
            height: 85vh;
            max-height: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px var(--azure-glow);
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 24px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .azure-badge {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #0078d4, #00bcf2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px var(--azure-glow);
        }

        .header-title h1 {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .header-title p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out;
            word-wrap: break-word;
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-bubble);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom-left-radius: 4px;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px var(--azure-glow);
        }

        .chat-input-area {
            padding: 18px 24px;
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid var(--card-border);
        }

        .input-form {
            display: flex;
            gap: 12px;
        }

        .input-form input {
            flex: 1;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 18px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-form input:focus {
            border-color: var(--azure-blue);
            box-shadow: 0 0 0 3px var(--azure-glow);
        }

        .input-form button {
            background: linear-gradient(135deg, #0078d4, #005a9e);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        .input-form button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .input-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .citations-container {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
        }

        .citations-header {
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .citation-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .citation-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .citation-card-title {
            font-weight: 500;
            color: #f1f5f9;
            margin-bottom: 2px;
        }

        .citation-card-source {
            color: var(--text-secondary);
            font-size: 0.75rem;
            line-height: 1.4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-info">
                <div class="azure-badge">☁️</div>
                <div class="header-title">
                    <h1>Azure AI Agent Chatbot</h1>
                    <p><span class="status-dot"></span> App Service Secured</p>
                </div>
            </div>
        </header>

        <main class="chat-messages" id="chatMessages">
            <div class="message bot">
                👋 Hello! Welcome to your secure Enterprise Assistant. I am connected directly to your Azure AI Foundry Agent using System-Assigned Managed Identity. How can I help you today?
            </div>
        </main>

        <footer class="chat-input-area">
            <form class="input-form" id="chatForm">
                <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" required />
                <button type="submit" id="sendBtn">Send</button>
            </form>
        </footer>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let activeThreadId = ""; // Retains session state across messages

        function appendMessage(text, sender, citations = []) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            
            // Text part
            const textSpan = document.createElement('span');
            textSpan.style.whiteSpace = 'pre-wrap';
            textSpan.textContent = text;
            msgDiv.appendChild(textSpan);

            // Citations part (only for bot responses with citations)
            if (sender === 'bot' && citations && citations.length > 0) {
                const citeContainer = document.createElement('div');
                citeContainer.classList.add('citations-container');

                const header = document.createElement('div');
                header.classList.add('citations-header');
                header.innerHTML = '🔍 References & Citations';
                citeContainer.appendChild(header);

                const list = document.createElement('div');
                list.classList.add('citation-list');

                citations.forEach(cite => {
                    const card = document.createElement('div');
                    card.classList.add('citation-card');

                    const title = document.createElement('div');
                    title.classList.add('citation-card-title');
                    title.textContent = `[${cite.index}] ${cite.text || 'Document Reference'}`;
                    card.appendChild(title);

                    const src = document.createElement('div');
                    src.classList.add('citation-card-source');
                    src.textContent = cite.source || 'Azure AI internal search query result.';
                    card.appendChild(src);

                    list.appendChild(card);
                });

                citeContainer.appendChild(list);
                msgDiv.appendChild(citeContainer);
            }

            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: text,
                        thread_id: activeThreadId
                    })
                });
                
                const data = await res.json();
                
                // Track active thread id for subsequent requests
                if (data.thread_id) {
                    activeThreadId = data.thread_id;
                }

                if (data.reply) {
                    appendMessage(data.reply, 'bot', data.citations);
                } else {
                    appendMessage("Error: Could not retrieve response from server.", 'bot');
                }
            } catch (err) {
                appendMessage("Connection error. Please try again.", 'bot');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        });
    </script>
</body>
</html>
